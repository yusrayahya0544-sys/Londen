<div class="add-product-card" style="background: #f9fbf9; border: 1px solid var(--color-border); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">

            </div>
            <div style="flex: 1;">

        <div style="display: flex; gap: 1rem; margin-top: 10px;">
    <div style="flex: 1;">
        <label style="font-weight: bold; font-size: 0.9rem;">Amharic Name</label>

    </div>
    <div style="flex: 1;">
        <label style="font-weight: bold; font-size: 0.9rem;">Oromo Name</label>
        <input type="text" id="new-product-name-om" style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; margin-top: 4px;">
    </div>
</div>

        <div>

        <div>

    <select id="new-product-category" style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; margin-top: 4px;">

        <option value="4">Headsets</option>

</div>

        <div style="display: flex; gap: 1rem;">
            <div style="flex: 1;">
                <label style="font-weight: bold; font-size: 0.9rem;">Image File</label>
                <input type="file" id="new-product-image" accept="image/*"  style="width: 100%; padding: 0.5rem; margin-top: 4px;">

            <div style="flex: 1;">

                </select>
            </div>
        </div>

        <button type="submit" id="save-product-btn" class="hero-cta-button" style="width: 100%; margin-top: 0.5rem;">Save Product</button>
        <p id="product-status-msg" style="text-align: center; font-weight: bold; margin: 0;"></p>

</div>

<div class="manage-products-card" style="background: #f9fbf9; border: 1px solid var(--color-border); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">

<div class="manage-products-card" style="background: #f9fbf9; border: 1px solid var(--color-border); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
    <h3 style="margin-top: 0; color: var(--color-primary-dark);">Manage Products</h3>
    <div id="admin-product-list" style="display: flex; flex-direction: column; gap: 10px;">
        <p>Loading products...</p>
    </div>
</div>
        <div id="orders-container">
            <!-- Orders will be injected here by JavaScript later -->
            <p>Loading orders...</p>
        </div>
    </div>

    <!-- ADMIN LOGIC -->
    <script>
        // Your Supabase credentials
       const supabaseUrl = 'https://gyggowcnigjrnnezgbjx.supabase.co';
       const supabaseKey = 'sb_publishable_nKPiVuznJMIv1KCJMy_fJA_AKBIbttG';
       const db = supabase.createClient(supabaseUrl, supabaseKey);


        // 1. Check if the user is already logged in when they open the page
db.auth.onAuthStateChange((event, session) => {
    if (session) {
        // Logged in!
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
        loadOrders();
        loadAdminProducts();  // <--- ADD THIS LINE HERE
    } else {
        // Logged out
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('dashboard-section').style.display = 'none';
    }
});
        // 2. Handle the Login Form submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            const errorMsg = document.getElementById('login-error');
             errorMsg.textContent = "Logging in...";
            errorMsg.style.color = "black";
            
            const { data, error } = await db.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorMsg.textContent = "Error: " + error.message;
                errorMsg.style.color = "red";
            }
        });

        // 3. Handle Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await db.auth.signOut();
        });

        // 4. Placeholder for loading orders (we will write this in the next step)
       // 4. Load and display orders
async function loadOrders() {
    const container = document.getElementById('orders-container');
    container.innerHTML = "<p>Loading orders...</p>";

    // Fetch orders and their related items (using the foreign key!)
    const { data: orders, error } = await db
        .from('orders')
        .select(`
            *,
            order_item (
                quantity,
                price_at_time,
                products ( name )
            )
        `)
        .order('created_at', { ascending: false });

    if (error) {
        container.innerHTML = "<p style='color:red'>Error loading orders: " + error.message + "</p>";
        return;
    }

    if (orders.length === 0) {
        container.innerHTML = "<p>No orders yet.</p>";
        return;
    }

    // Build the HTML for each order
    container.innerHTML = ""; // Clear loading text

    orders.forEach(order => {
        // Format the items into a string (e.g., "2x Test Phone")
        let itemsHtml = "";
        if (order.order_item) {
            order.order_item.forEach(item => {
                const productName = item.products ? item.products.name : "Unknown Product";
                itemsHtml += `<li>${item.quantity}x ${productName} (${item.price_at_time} ETB each)</li>`;
            });
        }

        const orderCard = document.createElement('div');
        orderCard.style.border = "1px solid var(--color-border)";
        orderCard.style.padding = "1rem";
        orderCard.style.marginBottom = "1rem";
        orderCard.style.borderRadius = "8px";
        orderCard.style.backgroundColor = "#f9fbf9";

        orderCard.innerHTML = `
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
        <h3 style="margin: 0;">Order #${order.id} - ${order.customer_name}</h3>
        
        <select onchange="updateOrderStatus(${order.id}, this.value)" style="padding: 6px; border-radius: 6px; border: 1px solid #ccc; font-weight: bold; cursor: pointer; background: white;">
            <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
            <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
            <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
        </select>
    </div>
    
    <p style="margin: 0.2rem 0;"><strong>Phone:</strong> ${order.customer_phone}</p>
    <p style="margin: 0.2rem 0;"><strong>Method:</strong> ${order.delivery_method} ${order.delivery_address ? ' - ' + order.delivery_address : ''}</p>
    <p style="margin: 0.2rem 0;"><strong>Total:</strong> ${order.total_amount} ETB</p>
    
    <div style="margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px dashed #ccc;">
        <strong>Items:</strong>
        <ul style="margin: 0.2rem 0; padding-left: 1.5rem;">
            ${itemsHtml}
        </ul>
    </div> `
;

        container.appendChild(orderCard);
    });
}

// 5. Update Order Status
async function updateOrderStatus(orderId, newStatus) {
    const { error } = await db
        .from('orders')
        .update({ status: newStatus })
        .eq('id', orderId);

    if (error) {
        alert("Error updating status: " + error.message);
        console.error(error);
    } else {
        alert(`Order #${orderId} marked as ${newStatus.toUpperCase()}`);
        loadOrders(); // Refresh the list
    }
}
// 6. Add New Product Logic
   // 6. Add New Product Logic
document.getElementById('add-product-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    console.log("Save button clicked! Starting...");

    const btn = document.getElementById('save-product-btn');
    const msg = document.getElementById('product-status-msg');
    
    btn.disabled = true;
    btn.textContent = "Saving...";
    msg.textContent = "";

    const name = document.getElementById('new-product-name').value;
    const nameAm = document.getElementById('new-product-name-am').value;
const nameOm = document.getElementById('new-product-name-om').value;
    const price = parseFloat(document.getElementById('new-product-price').value);
    const desc = document.getElementById('new-product-desc').value;
    const stock = document.getElementById('new-product-stock').value === 'true';
    const catId = parseInt(document.getElementById('new-product-category').value);
    const file = document.getElementById('new-product-image').files[0];

    try {
        let imageUrl = 'https://placehold.co/400'; // Default fallback

        // 1. Upload the real image to Supabase Storage
        if (file) {
            const fileName = Date.now() + '_' + file.name;
            
            const { error: uploadError } = await db.storage
                .from('product-images') 
                .upload(fileName, file);
            
            if (uploadError) throw uploadError;

            const { data: urlData } = db.storage
                .from('product-images')
                .getPublicUrl(fileName);
            
            imageUrl = urlData.publicUrl;
        }

        // 2. Save Product Data to Database
        const { error: dbError } = await db.from('products').insert([{
            name: name,
            name_am:nameAm,
            name_om:nameOm,
            price: price,
            description: desc,
            in_stock: stock,
            image_url: imageUrl,
            category_id: catId 
        }]);

        if (dbError) throw dbError;

        msg.textContent = "✅ Product Added Successfully!";
        msg.style.color = "green";
        document.getElementById('add-product-form').reset();
        loadAdminProducts(); // Refresh the list below

    } catch (error) {
        console.error("SAVE ERROR:", error);
        msg.textContent = "❌ Error: " + error.message;
        msg.style.color = "red";
    } finally {
        btn.disabled = false;
        btn.textContent = "Save Product";
    }
});


// 7. Load Products for Admin to Manage
async function loadAdminProducts() {
    const container = document.getElementById('admin-product-list');
    
    const { data: products, error } = await db.from('products').select('*').order('created_at', { ascending: false });
    
    if (error) {
        container.innerHTML = "<p style='color:red'>Error loading products.</p>";
        return;
    }

    container.innerHTML = ""; // Clear loading text

    if (products.length === 0) {
        container.innerHTML = "<p>No products in the store yet.</p>";
        return;
    }

    products.forEach(product => {
        const row = document.createElement('div');
        row.style.display = "flex";
        row.style.justifyContent = "space-between";
        row.style.alignItems = "center";
        row.style.padding = "10px";
        row.style.background = "white";
        row.style.border = "1px solid #ddd";
        row.style.borderRadius = "8px";

        row.innerHTML = `
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="${product.image_url}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;">
                <div>
                    <strong style="display: block;">${product.name}</strong>
                    <span style="font-size: 0.85rem; color: #666;">${product.price} ETB</span>
                </div>
            </div>
            <button onclick="deleteProduct(${product.id})" style="background: #c0392b; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Delete</button>
        `;
        container.appendChild(row);
    });
}

// 8. Delete Product Function
async function deleteProduct(productId) {
    const confirmDelete = confirm("Are you sure you want to delete this product? This cannot be undone.");
    if (!confirmDelete) return;

    const { error } = await db.from('products').delete().eq('id', productId);

    if (error) {
        alert("Error deleting product: " + error.message);
    } else {
        alert("Product deleted successfully.");
        loadAdminProducts(); // Refresh the list
    }
}

// 9. Change Admin Password Logic
document.getElementById('update-password-btn').addEventListener('click', async () => {
    const newPassword = document.getElementById('new-admin-password').value;
    const msg = document.getElementById('password-status-msg');
    const btn = document.getElementById('update-password-btn');

    if (newPassword.length < 6) {
        msg.textContent = "❌ Password must be at least 6 characters.";
        msg.style.color = "red";
        return;
    }

    btn.disabled = true;
    btn.textContent = "Updating...";
    msg.textContent = "";

    // Use Supabase's built-in updateUser function
    const { data, error } = await db.auth.updateUser({ password: newPassword });

    if (error) {
        msg.textContent = "❌ Error: " + error.message;
        msg.style.color = "red";
    } else {
        msg.textContent = "✅ Password updated successfully!";
        msg.style.color = "green";
        document.getElementById('new-admin-password').value = ""; // Clear the input
    }

    btn.disabled = false;
    btn.textContent = "Update Password";
});

    </script>
